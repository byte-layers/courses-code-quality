title: "La qualité du logiciel, des normes au pipeline"
description: "Partir de six incidents réels, nommer la qualité avec ISO 25010, connaître les normes et référentiels qui s'imposent en France, mesurer la dette technique, la contrôler dans un pipeline et sécuriser la chaîne logicielle : sur un vrai projet, avec du code écrit par un agent d'IA."
level: beginner
tags: [quality]
prerequisites: "Savoir utiliser un terminal et Git. Les labs reprennent le projet fil rouge du stack « Coder avec un agent d'IA »."
layers:
  - title: "Apprendre des incidents"
    summary: "Six pannes et attaques réelles, et la phase où chacune est née"
    contents:
      - { slug: ariane-5-failure, role: read-first }
      - { slug: knight-capital-failure }
      - { slug: crowdstrike-outage }
      - { slug: trivy-compromise }
      - { slug: laravel-lang-compromise }
      - { slug: replit-agent-incident }
  - title: "Comprendre"
    summary: "Le vocabulaire de la qualité, et les textes qui l'imposent"
    contents:
      - { slug: iso-25010-quality-model, role: read-first }
      - { slug: french-quality-frameworks }
      - { slug: quality-obligations-by-company }
      - { slug: technical-debt }
      - { slug: quality-obligations-challenge, role: proof }
  - title: "Relire et tester"
    summary: "Juger le code d'un agent avec le vocabulaire du clean code, et vérifier que ses tests testent vraiment"
    contents:
      - { slug: clean-code-agent-diff }
      - { slug: tests-and-quality }
      - { slug: mutation-testing }
  - title: "Mesurer et contrôler"
    summary: "Mesurer la dette avec des outils, choisir ses seuils, puis en faire une barrière"
    contents:
      - { slug: measure-debt }
      - { slug: merge-request-quality-gate }
      - { slug: code-analysis-tools }
      - { slug: sonarqube-local }
  - title: "Sécuriser la chaîne logicielle"
    summary: "Dépendances, secrets et outils de build : les contrôler dans le pipeline, et reconnaître un paquet piégé"
    contents:
      - { slug: sast-sca-secrets, role: read-first }
      - { slug: security-pipeline }
      - { slug: typosquatting-challenge, role: proof }
